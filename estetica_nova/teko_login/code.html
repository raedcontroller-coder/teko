<!-- BEGIN: LoginForm -->
<form class="flex flex-col gap-4 w-full" data-purpose="login-form" onsubmit="event.preventDefault();">

<div class="flex flex-col gap-1.5" data-purpose="input-group-email">

<div class="relative flex items-center">
<!-- Mail Icon -->
<div class="absolute left-4.5 pointer-events-none text-[#00534C] flex items-center">

<rect height="15" rx="2.5" width="19" x="2.5" y="4.5"></rect>
<path d="M3.5 6.5L12 13.5L20.5 6.5"></path>
</svg>
</div>
<input class="w-full h-13 pl-13 pr-4 py-3.5 bg-white border border-[#D8E1E0] rounded-xl text-slate-800 text-sm font-medium focus:ring-2 focus:ring-[#00534C] focus:border-[#00534C] outline-none transition-shadow shadow-xs placeholder-[#9AA9A8]" id="email" placeholder="Digite seu e-mail" required="" type="email"/>
</div>
</div>
<!-- Password Input Field -->
<div class="flex flex-col gap-1.5" data-purpose="input-group-password">
<label class="text-sm font-semibold text-[#00534C] tracking-tight ml-0.5" for="password">
            Senha
          </label>
<div class="relative flex items-center">
<!-- Lock Icon -->
<div class="absolute left-4.5 pointer-events-none text-[#00534C] flex items-center">
<svg class="w-5 h-5 stroke-[1.8] stroke-current fill-none" viewbox="0 0 24 24">
<rect height="11" rx="2.5" width="16" x="4" y="10"></rect>
<path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
</svg>
</div>
<input class="w-full h-13 pl-13 pr-12 py-3.5 bg-white border border-[#D8E1E0] rounded-xl text-slate-800 text-sm font-medium focus:ring-2 focus:ring-[#00534C] focus:border-[#00534C] outline-none transition-shadow shadow-xs placeholder-[#9AA9A8]" id="password" placeholder="Digite sua senha" required="" type="password"/>
<!-- Toggle Visibility Eye Icon Button -->
<button aria-label="Revelar senha" class="absolute right-4 text-[#00534C] hover:opacity-80 transition-opacity focus:outline-none p-1" data-purpose="password-toggle-button" id="togglePassword" type="button">
<svg class="w-5 h-5 stroke-[1.8] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
<circle cx="12" cy="12" r="3.2"></circle>
</svg>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end -mt-0.5 mb-1" data-purpose="forgot-password">
<a class="text-xs font-semibold text-[#7635C7] underline decoration-dashed decoration-1 underline-offset-4 hover:opacity-80 transition-opacity" href="#">

<span>Entrar</span>

<svg class="w-5 h-5 stroke-[2.2] stroke-current fill-none" viewbox="0 0 24 24">

<button class="w-full h-13 bg-white hover:bg-slate-50 border border-[#D5DFDE] rounded-xl flex items-center justify-center gap-3 text-slate-700 font-semibold text-sm transition-all shadow-xs active:scale-[0.99] cursor-pointer" data-purpose="google-login-button" type="button">

<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.25 2.64 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>

<span class="tracking-tight text-slate-700">Entrar como Google</span>

<!-- Interactive script to toggle password visibility -->
<script data-purpose="toggle-password-script">
    const toggleButton = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    if (toggleButton && passwordInput) {
      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleButton.style.opacity = isPassword ? '0.65' : '1';
      });
    }
  </script>
</body></html>
